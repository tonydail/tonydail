<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="scripts/page-loader-start.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View and download Charles Dail's professional resume."
    />
    <meta
      name="keywords"
      content="Charles Dail resume, engineering leader resume, software architect resume"
    />
    <meta name="author" content="Charles Dail" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Charles Dail - Resume" />
    <meta
      property="og:description"
      content="View Charles Dail's professional engineering resume."
    />

    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Resume - Charles Dail | Engineering Leader & Software Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles/style.css?v=3" />
  </head>
  <body>
    <div id="page-loader" class="page-loader" role="status" aria-live="polite">
      <div class="page-loader-dialog">
        <span class="page-loader-spinner" aria-hidden="true"></span>
        <span>Loading page...</span>
      </div>
    </div>
    <div data-include="partials/header.html"></div>
    <main class="container-fluid px-1" role="main">
      <section>
        <h1 class="page-title color-primary">Resume</h1>
        <p class="page-content">
          View my professional experience and qualifications below, or open the PDF in a separate tab.
        </p>

        <div id="resume-status" class="content-status" role="status">
          Loading resume...
        </div>

        <div id="resume-viewer" class="resume-viewer" hidden>
          <div class="resume-actions">
            <a
              id="resume-open-link"
              class="btn-primary-custom"
              href="assets/charles-dail-resume.pdf"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
              Open PDF
            </a>
            <a
              id="resume-download-link"
              class="btn-outline-custom"
              href="assets/charles-dail-resume.pdf"
              download
            >
              <i class="fas fa-download" aria-hidden="true"></i>
              Download PDF
            </a>
          </div>

          <div
            id="resume-pages"
            class="resume-pages"
            aria-label="Charles Dail resume pages"
          ></div>
        </div>
      </section>
    </main>

    <div data-include="partials/footer.html"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="scripts/includes.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="scripts/resume.js?v=3"></script>
    <script src="scripts/page-ready.js?v=3"></script>
  </body>
</html>
